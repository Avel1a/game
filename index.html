<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>两千元的一个月</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="一个关于大学生消费观的像素小游戏：用2000元生活费度过一个月。">
<style>
/* Layout: 手机竖屏单列 —— 顶部状态条 / 像素舞台 / 对话卡片，一屏玩完；单一夜色主题 */
:root{
  --night:#1b1d2e; --night-2:#272b44; --night-3:#363b5c;
  --paper:#fbf7ea; --ink:#232136; --ink-soft:#615d78;
  --coin:#f0b43a; --coral:#e8664f; --leaf:#3f9e63; --sky:#8fcbe3; --plum:#9a6fd0;
  --c-food:#b9b4a6; --c-need:#4f8fd6; --c-growth:#3f9e63; --c-people:#f0b43a; --c-charity:#e88fb4; --c-want:#9a6fd0; --c-impulse:#e8664f;
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --font-num:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}

/* 像素边框 */
.px{box-shadow:0 -3px 0 0 var(--line,var(--ink)),0 3px 0 0 var(--line,var(--ink)),-3px 0 0 0 var(--line,var(--ink)),3px 0 0 0 var(--line,var(--ink))}

.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end}
.hud .label{display:block;font-size:11px;letter-spacing:.12em;color:#a9a6c2}
.hud b{font-family:var(--font-num);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#hMoney{color:var(--coin)}
#hMoney.low{color:var(--coral)}
.money{text-align:center}
.mood{min-width:92px}
.bar{height:10px;background:var(--night-3);margin-top:6px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c-charity);transition:width .4s}
.track{height:6px;background:var(--night-3);position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--sky)}
.track span{position:absolute;top:-2px;width:4px;height:10px;background:var(--night-3);margin-left:-2px}
.track span.done{background:var(--coin)}

.stage{position:relative;line-height:0}
#cv{width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--sky);display:block}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:22%;top:18%;font-family:var(--font-num);font-weight:700;font-size:15px;line-height:1;color:var(--paper);
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);animation:rise 1.3s ease-out forwards;white-space:nowrap}
.float.minus{color:#ffd9cf}.float.plus{color:#b8f0c8}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}

.panel{flex:1;min-height:0;overflow-y:auto;background:var(--paper);color:var(--ink);padding:16px 16px 14px;margin:3px}
.panel .meta{font-size:12px;letter-spacing:.1em;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.panel h2{font-size:19px;margin:4px 0 6px;text-wrap:balance;line-height:1.35}
.panel p{margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#fff;color:var(--ink);padding:11px 12px;font-size:15px;line-height:1.35;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),0 5px 0 0 var(--ink-soft)}
.opt:active{transform:translateY(3px);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.opt:focus-visible{outline:3px solid var(--coin);outline-offset:4px}
.opt .amt{font-family:var(--font-num);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.opt .amt.out{color:var(--coral)}.opt .amt.in{color:var(--leaf)}.opt .amt.zero{color:var(--ink-soft)}
.opt small{display:block;font-size:12px;color:var(--coral)}
.walklog{display:flex;flex-direction:column;gap:6px}
.walklog .now{font-size:17px;font-weight:700}
.walklog .tip{color:var(--ink-soft);font-size:14px}
.fb{border-left:4px solid var(--coin);padding:6px 10px;background:#f4eedb;margin:8px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12px;padding:2px 8px;background:var(--ink);color:var(--paper);font-family:var(--font-num)}
.go{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;background:var(--coin);color:var(--ink);font-weight:700;font-size:16px;padding:12px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),0 5px 0 0 #a8771c}
.go:active{transform:translateY(3px)}
.go:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
.go.ghost{background:var(--paper)}

/* 开始与结局 */
.overlay{position:fixed;inset:0;background:var(--night);overflow-y:auto;z-index:5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.logo{font-size:38px;line-height:1.15;font-weight:900;letter-spacing:.06em;color:var(--coin);text-shadow:3px 3px 0 var(--coral),6px 6px 0 var(--ink);text-wrap:balance;margin:0}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--sky)}
.card{background:var(--paper);color:var(--ink);padding:16px;margin:3px}
.card h3{margin:0 0 8px;font-size:16px}
.card ul{margin:0;padding-left:20px}
.card li+li{margin-top:4px}
#startPortrait{display:block;width:96px;height:128px;image-rendering:pixelated;align-self:center}

.verdict{display:inline-block;font-size:13px;padding:3px 10px;background:var(--coral);color:#fff;font-weight:700;letter-spacing:.08em}
.endtitle{font-size:30px;margin:6px 0 2px;color:var(--coin);text-wrap:balance;line-height:1.25}
.stars{font-size:20px;letter-spacing:4px;color:var(--coin)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--night-2);padding:10px;min-width:0}
.stat span{display:block;font-size:11px;color:#a9a6c2;letter-spacing:.1em}
.stat b{font-family:var(--font-num);font-size:18px;font-variant-numeric:tabular-nums}
.stack{display:flex;height:18px;background:var(--night-3);overflow:hidden}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend em{width:10px;height:10px;flex:none}
.legend b{margin-left:auto;font-family:var(--font-num);font-weight:400;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:8px;font-size:14px}
.review div{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:start}
.review .d{font-family:var(--font-num);color:var(--ink-soft)}
.review .a{font-family:var(--font-num);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 5px;color:#fff;margin-left:4px;vertical-align:1px}
.quote{font-size:15px;border-left:4px solid var(--coral);padding:4px 12px;margin:10px 0 0}
.debtline{color:var(--coral);font-weight:700}
.toggles{display:flex;justify-content:flex-end;gap:8px;margin-top:-4px}
.tg{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;background:var(--night-3);color:var(--paper);letter-spacing:.06em}
.tg[aria-pressed="false"]{color:#8d8aa6;text-decoration:line-through}
.tg:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.res{display:flex;gap:12px;align-items:center;margin:6px 0 4px}
.res>div{min-width:0}
.res h2{margin:2px 0 0}
.face{width:66px;height:54px;flex:none;image-rendering:pixelated;background:#e9f3f7;box-shadow:0 0 0 2px var(--ink)}
.feel{font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
#gateSign{position:absolute;top:24.3%;height:12.5%;width:51.6%;display:flex;align-items:center;justify-content:center;
  color:#fff3c4;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,3.6vw,17px);line-height:1;white-space:nowrap;transition:opacity .6s;
  text-shadow:1px 1px 0 #7a2a22}
#gateSign.fade{opacity:0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:#fff;color:var(--ink);font-weight:700;
  box-shadow:0 0 0 2px var(--ink)}
.who canvas{width:96px;height:150px;image-rendering:pixelated}
.who[aria-pressed="true"]{background:#fff1c9;box-shadow:0 0 0 2px var(--ink),0 0 0 6px var(--coin)}
.who:focus-visible{outline:3px solid var(--sky);outline-offset:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;font-size:16px;padding:10px 12px;border:0;background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--ink);border-radius:0;width:100%;box-sizing:border-box;color-scheme:light}
.field input:focus{outline:3px solid var(--coin);outline-offset:2px}
.endhead{display:flex;gap:14px;align-items:center}
.endhead canvas{width:88px;height:72px;flex:none;image-rendering:pixelated;background:#e9f3f7;box-shadow:0 0 0 3px var(--paper)}
.endhead>div{min-width:0}
@media (prefers-reduced-motion:reduce){.float{animation-duration:.01s}.bar i{transition:none}}
</style>

<div id="app">
  <div class="hud">
    <div><span class="label">日期</span><b id="hDate">11月1日</b></div>
    <div class="money"><span class="label">余额</span><b id="hMoney">¥2000</b></div>
    <div class="mood"><span class="label">心情</span><div class="bar"><i id="hMood" style="width:60%"></i></div></div>
  </div>
  <div class="toggles"><button class="tg" type="button" id="tgMusic" aria-pressed="true">音乐 开</button><button class="tg" type="button" id="tgFx" aria-pressed="true">音效 开</button></div>
  <div class="track" id="track"><i id="hProg" style="width:0"></i></div>
  <div class="stage"><canvas id="cv" width="256" height="144" aria-label="像素小人在校园里从左往右行走"></canvas><div id="floats"></div><div id="gateSign">广东金融学院</div></div>
  <section class="panel px" id="panel" aria-live="polite"></section>
</div>

<div class="overlay" id="start">
  <div class="sheet">
    <div class="kicker">思政课 · 互动小游戏</div>
    <h1 class="logo">两千元的<br>一个月</h1>
    <div class="card px">
      <h3>选择你的角色</h3>
      <div class="pick">
        <button class="who" type="button" id="pickGirl" aria-pressed="true"><canvas id="pvGirl" width="16" height="25"></canvas>女生</button>
        <button class="who" type="button" id="pickBoy" aria-pressed="false"><canvas id="pvBoy" width="16" height="25"></canvas>男生</button>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="nick">你的昵称</label>
        <input id="nick" type="text" maxlength="8" placeholder="最多 8 个字，不填就叫小林" autocomplete="off">
      </div>
    </div>
    <div class="card px">
      <h3>你是一名大一新生</h3>
      <p style="margin:0">这个月爸妈给了你 <b>2000 元</b> 生活费。食堂三餐每天要花 <b>32 元</b>，会自动扣除。一路上你会遇到各种花钱的机会：促销、聚餐、分期、直播间……</p>
    </div>
    <div class="card px">
      <h3>怎么玩</h3>
      <ul>
        <li>你的角色会自己往前走，每走过一盏路灯就是一天。</li>
        <li>遇到事件时，选择花不花、花多少。</li>
        <li>一个月结束后，根据你的选择揭晓你的<b>消费观结局</b>。</li>
      </ul>
    </div>
    <button class="go" id="btnStart" type="button">开始这个月 →</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="sheet" id="endSheet"></div>
</div>

<script>
(function(){
const START=2000, DAILY=32, DAYLEN=64, SPEED=58, DAYS=30, CHARX=50;
const W=256,H=144,GROUND=114;

/* ---------- 事件 ---------- */
// tag: need 必需 / growth 成长 / people 人情 / charity 公益 / want 享受 / impulse 冲动 / save 不花 / skip 省掉必需 / work 收入 / loan 借贷 / install 分期
const POOL=[
 {day:2,icon:'gym',wall:'#5d7fb8',awn:'#e8664f',place:'校门口健身房',title:'健身房开业大酬宾',
  text:'学校门口新开了一家健身房。销售拦住你：“同学，年卡今天只要 699，原价 1999！明天就恢复原价了。”室友已经心动了。',
  opts:[
   {t:'办年卡，今天最划算',cost:699,tag:'impulse',mood:5,fb:'“限时优惠”“明天恢复原价”是最常见的营销话术。年卡买了能不能坚持去，才是真正的成本。'},
   {t:'先办一个月卡试试',cost:99,tag:'growth',mood:3,fb:'先试再决定，是对自己的钱包负责，也是对健康的投资。'},
   {t:'不办，晚上去操场跑步',cost:0,tag:'save',mood:2,fb:'锻炼不一定要花钱，学校操场就是免费的健身房。'}]},
 {day:5,icon:'tea',wall:'#c98a5c',awn:'#f6d36b',place:'奶茶店',title:'联名奶茶刷屏了',
  text:'热门动漫和奶茶店出了联名款，买两杯送限定徽章。朋友圈已经刷屏，同学问你：“你还没喝？”',
  opts:[
   {t:'买两杯，把徽章集齐',cost:66,tag:'impulse',mood:5,fb:'为周边买单、为“别人都有”买单，这就是从众消费和攀比心理。'},
   {t:'买一杯尝尝就好',cost:18,tag:'want',mood:4,fb:'偶尔犒劳一下自己没问题，控制在预算里就好。'},
   {t:'不跟风',cost:0,tag:'save',mood:0,fb:'不被朋友圈带节奏，是一种难得的定力。'}]},
 {day:8,icon:'book',wall:'#6c8a5a',awn:'#fbf7ea',place:'教务处',title:'考证报名和专业教材',
  text:'英语四级报名开始了，专业课老师也要求买教材。新教材加报名费一共 230 元；学长愿意把二手教材便宜转给你，这样一共 140 元。',
  opts:[
   {t:'买新教材 + 报名',cost:230,tag:'growth',mood:3,fb:'为学习花钱是投资自己，这笔钱值得。'},
   {t:'用学长的二手书 + 报名',cost:140,tag:'growth',mood:4,fb:'既投资了自己，又省了钱，还让书本循环利用，一举三得。'},
   {t:'都不买，下学期再说',cost:0,tag:'skip',mood:-5,fb:'学习上的必要支出不该省。耽误的时间和机会，比这点钱贵得多。'}]},
 {day:11,icon:'bag',wall:'#d4577a',awn:'#fbf7ea',place:'快递站',title:'双十一零点',
  text:'零点到了，购物车里躺着衣服、零食、小摆件，凑满减一共 580 元。天冷了，你确实缺一件厚外套和一瓶洗发水。',
  opts:[
   {t:'清空购物车，凑满减',cost:580,tag:'impulse',mood:7,fb:'为了凑满减而多买的东西，往往并不是你真正需要的。'},
   {t:'只买外套和洗发水',cost:160,tag:'need',mood:3,fb:'分清“需要”和“想要”，这就是理性消费的第一步。'},
   {t:'一件都不买',cost:0,tag:'skip',mood:-4,fb:'节约是好习惯，但天冷了没有外套会冻着，必要的东西还是该买。'}]},
 {day:13,icon:'phone',wall:'#4a4f6e',awn:'#8fcbe3',place:'手机店',title:'新款手机发布',
  text:'新款手机发布了。你的旧手机还能用，就是电池不太行。店员说：“12 期免息，每月只要 549，凭学生证就能办！”',
  opts:[
   {t:'分期买新手机',cost:549,tag:'install',mood:8,debt:549*11,fb:'“每月只要”把大额消费拆小了，但接下来 11 个月都要还，总价 6588 元，远超每月生活费。'},
   {t:'花 129 元换块新电池',cost:129,tag:'need',mood:2,fb:'解决真正的问题，而不是追逐新品。'},
   {t:'继续用，出门带充电宝',cost:0,tag:'save',mood:0,fb:'能用就继续用，物尽其用也是一种节约。'}]},
 {day:15,icon:'cake',wall:'#e3a65b',awn:'#e8664f',place:'校外餐厅',title:'室友过生日',
  text:'室友过生日，大家约在校外餐厅聚餐，人均 80 元。有人提议再合买个礼物，每人再加 70 元。',
  opts:[
   {t:'去聚餐，再合送礼物',cost:150,tag:'people',mood:8,fb:'珍惜友情很好，也要记得量力而行。'},
   {t:'去聚餐，送张手写贺卡',cost:82,tag:'people',mood:7,fb:'心意不在于价格，真诚的祝福同样珍贵。'},
   {t:'找个借口不去了',cost:0,tag:'save',mood:-8,noPeople:true,fb:'正常的人情往来也是生活的一部分，一味回避会让自己变得孤单。'}]},
 {day:17,icon:'live',wall:'#7a5ab8',awn:'#f29ac0',place:'直播间',title:'直播间限时秒杀',
  text:'睡前刷到美妆直播：“最后 100 单！原价 899 的护肤套装今晚只要 299！”倒计时还剩 30 秒。你的洗面奶刚好用完了。',
  opts:[
   {t:'马上下单抢套装',cost:299,tag:'impulse',mood:5,fb:'倒计时和“最后 X 单”是在制造焦虑，让你来不及思考就下单。'},
   {t:'关掉直播，只买洗面奶',cost:45,tag:'need',mood:1,fb:'只买真正用完的东西，不被直播间的气氛带走。'},
   {t:'关掉手机去睡觉',cost:0,tag:'save',mood:0,fb:'冷静一晚上，很多“必须现在买”的东西其实可以不买。'}]},
 {day:19,icon:'coin',wall:'#8a6a4a',awn:'#3f9e63',place:'图书馆',title:'勤工助学岗位',
  text:'图书馆在招勤工助学岗位，每周两个下午帮忙整理书架，这个月能拿到 240 元。',
  opts:[
   {t:'报名，自己挣一点',cost:-240,tag:'work',mood:-2,fb:'通过劳动获得收入，更能体会每一分钱都来之不易。'},
   {t:'不报，时间留给学习和休息',cost:0,tag:'save',mood:1,fb:'这也是合理的选择，时间同样是宝贵的资源。'}]},
 {day:20,icon:'flyer',wall:'#55566a',awn:'#e8664f',place:'宿舍楼下',title:'“学生专享贷款”',cond:s=>s.money<380,

/* 每局随机抽取事件、随机安排日期：双十一固定在 11 日，校园贷只在下半月出现 */
const CORE=['考证报名和专业教材','双十一零点','新款手机发布','降温感冒了'];
const SLOTS=[2,4,6,8,13,15,17,19,21,23,25,27,29];
let EVENTS=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildEvents(){
  const d11=POOL.find(e=>e.title==='双十一零点'),loan=POOL.find(e=>e.cond);
  const core=POOL.filter(e=>CORE.includes(e.title)&&e!==d11);
  const extra=shuffle(POOL.filter(e=>!CORE.includes(e.title)&&e!==loan)).slice(0,6);
  const list=shuffle(core.concat(extra));
  const slots=shuffle(SLOTS).slice(0,list.length+1).sort((a,b)=>a-b);
  // 校园贷放在 17 日以后的某个空位
  const late=slots.filter(d=>d>=17);const loanDay=late[Math.floor(Math.random()*late.length)];
  const rest=slots.filter(d=>d!==loanDay);
  EVENTS=list.map((e,i)=>Object.assign({},e,{day:rest[i]})).concat([Object.assign({},d11,{day:11}),Object.assign({},loan,{day:loanDay})]);
  EVENTS.sort((a,b)=>a.day-b.day);
  EVENTS.forEach(e=>e.x=(e.day-1)*DAYLEN+DAYLEN*0.5);
}

/* ---------- 主循环 ---------- */
function step(ts){
  raf=requestAnimationFrame(step);
  const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  if(pause)return;
  if(S.mode==='walk'){
    S.wx+=SPEED*dt;
    // 跨天扣伙食
    const nd=Math.min(DAYS,1+Math.floor(S.wx/DAYLEN));
    while(S.day<nd){S.day++;chargeFood();walkPanel();}
    // 事件
    const e=EVENTS[S.ev];
    if(e&&S.wx>=e.x){
      if(e.cond&&!(e.day in evCache?evCache[e.day]:e.cond(S))){S.ev++;}
      else{S.wx=e.x;S.mode='bubble';hud();sfx('pop');setTimeout(()=>{S.mode='event';eventPanel(e)},450)}
    }
    if(!EVENTS[S.ev]&&S.wx>=DAYS*DAYLEN){S.wx=DAYS*DAYLEN;pause=true;showEnd()}
    hud();
  }
  drawScene();
}

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05)}

const MEL=[76,null,79,null,81,79,76,null, 72,null,74,76,null,null,74,null, 77,null,76,77,81,null,79,77, 79,null,null,null,74,null,76,74,
           76,null,79,null,84,null,83,81, 79,null,76,null,71,null,74,null, 77,76,74,null,74,76,77,79, 76,null,72,null,72,null,null,null];
const CH={C:[60,64,67],Am:[57,60,64],F:[53,57,60],G:[55,59,62],Em:[52,55,59]};
const PROG=['C','Am','F','G','C','Em','F','C'];
const STEP=60/100/2; // 100 BPM 的八分音符
function chordAt(i){const bar=Math.floor(i/8)%8,half=i%8;if(bar===6&&half>=4)return CH.G;return CH[PROG[bar]]}
function schedule(){
  const c=AU.ctx;while(AU.next<c.currentTime+.25){const i=AU.step%64,t=AU.next;
    const n=MEL[i];if(n){let len=1;while(len<6&&MEL[(i+len)%64]===null)len++;note(t,n,STEP*len*.92,'triangle',.22,AU.bgm)}
    const ch=chordAt(i);note(t,ch[[0,1,2,1,0,1,2,1][i%8]]+12,STEP*.9,'sine',.07,AU.bgm);
    if(i%4===0)note(t,ch[0]-12,STEP*3.6,'triangle',.16,AU.bgm);
    if(i%2===1)note(t,96,.03,'square',.012,AU.bgm);
    AU.step++;AU.next+=STEP}}
function musicOn(){if(!audioInit())return;const c=AU.ctx;AU.bgm.gain.cancelScheduledValues(c.currentTime);AU.bgm.gain.setTargetAtTime(1,c.currentTime,.3);
  if(!AU.timer){AU.next=c.currentTime+.08;AU.timer=setInterval(schedule,60)}}
function musicOff(){if(!AU.ctx)return;AU.bgm.gain.setTargetAtTime(0,AU.ctx.currentTime,.08);clearInterval(AU.timer);AU.timer=0}
function seq(notes,gap,type,vol,durMul){const t=AU.ctx.currentTime+.02;notes.forEach((n,i)=>{if(n)note(t+i*gap,n,gap*(durMul||1.6),type,vol,AU.sfx)})}
const SFX={
 click:()=>note(AU.ctx.currentTime,84,.05,'square',.06,AU.sfx),
 pop:()=>note(AU.ctx.currentTime,76,.14,'triangle',.25,AU.sfx,88),
 spend:()=>seq([83,76],.07,'square',.09,1.4),
 earn:()=>seq([83,88],.08,'square',.1,2),
 neutral:()=>seq([72,74],.1,'triangle',.22),
 happy:()=>seq([72,76,79],.08,'triangle',.24),
 joy:()=>seq([72,76,79,84,88],.06,'square',.09,2),
 proud:()=>seq([84,null,91,96],.07,'sine',.25,2.4),
 sad:()=>seq([69,65],.2,'triangle',.24,1.3),
 cry:()=>{seq([67,66,64,62],.2,'sine',.22,1.4)},
 shock:()=>{const t=AU.ctx.currentTime;[0,.16].forEach(d=>{note(t+d,57,.12,'square',.08,AU.sfx);note(t+d,58,.12,'square',.08,AU.sfx)})},
 end_wise:()=>seq([72,76,79,84,null,79,84],.11,'square',.08,1.8),
 end_ok:()=>seq([72,76,79,84],.12,'triangle',.24,2),
 end_stingy:()=>seq([72,69,67,64],.16,'triangle',.22,1.6),
 end_moon:()=>seq([79,76,72,67],.13,'square',.08,1.5),
 end_debt:()=>seq([64,63,62,61,null,48],.17,'square',.08,1.6)};
function sfx(name){if(!AU.fx||!SFX[name])return;if(!audioInit())return;try{SFX[name]()}catch(e){}}
function renderToggles(){const m=$('tgMusic'),f=$('tgFx');m.setAttribute('aria-pressed',AU.music);m.textContent='音乐 '+(AU.music?'开':'关');
  f.setAttribute('aria-pressed',AU.fx);f.textContent='音效 '+(AU.fx?'开':'关')}
$('tgMusic').addEventListener('click',()=>{AU.music=!AU.music;saveAudio();renderToggles();AU.music?musicOn():musicOff()});
$('tgFx').addEventListener('click',()=>{AU.fx=!AU.fx;saveAudio();renderToggles();sfx('click')});
renderToggles();
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else if(AU.music||AU.fx){AU.ctx.resume();if(AU.music&&AU.timer)AU.next=Math.max(AU.next,AU.ctx.currentTime+.05)}});

/* ---------- 启动 ---------- */
function preview(id,g,face){const c=$(id).getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,16,25);drawChar(c,g,0,0,0,1,face)}
preview('pvGirl','girl','happy');preview('pvBoy','boy','neutral');
function setGender(g){P.gender=g;$('pickGirl').setAttribute('aria-pressed',g==='girl');$('pickBoy').setAttribute('aria-pressed',g==='boy');
  preview('pvGirl','girl',g==='girl'?'happy':'neutral');preview('pvBoy','boy',g==='boy'?'happy':'neutral')}
$('pickGirl').addEventListener('click',()=>setGender('girl'));
$('pickBoy').addEventListener('click',()=>setGender('boy'));
$('btnStart').addEventListener('click',()=>{const n=$('nick').value.trim();P.name=n?n.slice(0,8):'小林';
  $('start').hidden=true;$('gateSign').classList.remove('fade');reset();pause=false;last=0;audioInit();sfx('click');if(AU.music)musicOn()});
reset();pause=true;drawScene();
raf=requestAnimationFrame(step);
document.addEventListener('visibilitychange',()=>{last=0});
})();
</script>
